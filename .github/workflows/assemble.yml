name: Assemble DocuFlow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild files from compressed bundles
        run: |
          set -euo pipefail
          cat .assemble/app.js.00 .assemble/app.js.01 | gunzip > app.js
          gunzip -c .assemble/ocr.js.b64 > ocr.js
          gunzip -c .assemble/styles.css.b64 > styles.css

      - name: Verify exact file contents
        run: |
          set -euo pipefail
          echo "2a09605217845e308ff669a877f48ef731ccff882e0d98665ad636205a336c04  index.html" | sha256sum -c -
          echo "18130b829ee7b23c2e7f5222dd7dcd3a60c14426f931d30c6f27ead0b8be4a46  styles.css" | sha256sum -c -
          echo "7bd9b4df193dd294028af84a27b404bf62cdfb0621448a00ba0594e3f04d9b70  app.js" | sha256sum -c -
          echo "6015c2d9e5302664398a92a76bc53cdfd7d9afc1d0dce8e4f2b7e382bfdd7a6c  data.js" | sha256sum -c -
          echo "ccef2f9c6fec3aacdebccd8292b9d169861bb499adac0fd247f3cc07f19deaf1  ocr.js" | sha256sum -c -

      - name: Commit assembled site and remove temporary files
        run: |
          set -euo pipefail
          rm -rf .assemble
          rm -f README.md .github/workflows/assemble.yml
          git config user.name "Primetimeplayer"
          git config user.email "primetimeplayer45@gmail.com"
          git add -A
          git status --short
          git commit -m "Add DocuFlow application files"
          git push
